name: Amazon Associates Hourly Analytics & Product Health Sync

on:
  schedule:
    # Runs hourly (jittered to :12 past the hour to avoid :00 scheduler congestion)
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-ads-hourly
  cancel-in-progress: false

jobs:
  sync-amazon-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Hourly Amazon Ads Sync & Dogs-of-Amazon Health Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/portfolio/amazon-ads-sync.mjs
