<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Follower Checker</title>
    <style>
        body {
            width: 300px;
            padding: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        button {
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            background-color: #fe2c55;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #e02449;
        }
    </style>
</head>
<body>
    <h2>TikTok Follower Checker</h2>
    <button id="check-followers">Check Non-Followers</button>
    <script src="popup.js"></script>
</body>
</html>
