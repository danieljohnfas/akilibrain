services:
  - type: web
    name: scrapelab
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # One API key per consuming site; Render generates them. Copy each into that site's SCRAPELAB_KEY.
      - key: SCRAPELAB_KEY_AKILIHUB
        generateValue: true
      - key: SCRAPELAB_KEY_TIKETICHAP
        generateValue: true
      - key: MIN_DOMAIN_INTERVAL_MS
        value: "2000"
      - key: BLOCKLIST
        value: "glassdoor.com,youtube.com,tiktok.com"
      # Optional: self-hosted Firecrawl for JS-heavy pages
      - key: FIRECRAWL_URL
        sync: false
