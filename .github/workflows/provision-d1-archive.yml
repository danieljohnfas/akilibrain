name: Provision D1 Archive Database

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: List D1 Databases and Create akilibrain-archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "==== Listing Cloudflare D1 Databases ===="
          npx wrangler d1 list || true
          echo "==== Creating akilibrain-archive D1 Database ===="
          npx wrangler d1 create akilibrain-archive || true
