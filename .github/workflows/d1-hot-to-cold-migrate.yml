name: Hot to Cold Tier Migration (Supabase to Cloudflare D1)

on:
  workflow_dispatch:
    inputs:
      prune:
        description: 'Prune migrated rows from Supabase to reclaim storage'
        type: boolean
        default: true
        required: true

jobs:
  migrate:
    name: Migrate Expired Data to Cold Tier
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Hot -> Cold Migration Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: 1e0d9072-50da-4bfb-bbba-9c8596a69b88
        run: |
          if [ "${{ github.event.inputs.prune }}" = "true" ]; then
            node scripts/migrate-hot-to-cold.mjs --prune
          else
            node scripts/migrate-hot-to-cold.mjs
          fi
