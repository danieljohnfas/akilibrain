name: Check D1 Archive Status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check D1 Counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute akilibrain-archive --remote --command="SELECT 'archived_jobs' as tbl, count(*) as count FROM archived_jobs UNION ALL SELECT 'archived_tenders' as tbl, count(*) as count FROM archived_tenders;"
