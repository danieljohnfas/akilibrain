name: Portfolio health

# Daily checks of all seven sites (pages up, private files hidden, no ad-network code,
# affiliate tags present). A failed run emails the repository owner.
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/portfolio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/portfolio/health.mjs
