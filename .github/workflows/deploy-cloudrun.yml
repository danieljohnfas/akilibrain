name: Deploy to Google Cloud Run (Always Free Tier)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - 'scraper/**'
      - 'scrapelab/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'personalagent-500516' }}
  GCP_REGION: us-central1 # Official Google Cloud Run Always Free Tier region
  SERVICE_NAME: akilibrain
  AR_REPO: akilibrain

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud artifacts repositories describe "$AR_REPO" \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$AR_REPO" \
            --project="$GCP_PROJECT_ID" \
            --repository-format=docker \
            --location="$GCP_REGION" \
            --description="AkiliBrain production container images"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build & Push Standalone Docker Image
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$SERVICE_NAME:$GITHUB_SHA"
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL="https://akilibrain.com" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_ADSENSE_PUB_ID="${{ secrets.NEXT_PUBLIC_ADSENSE_PUB_ID }}" \
            --build-arg NEXT_PUBLIC_CLARITY_ID="${{ secrets.NEXT_PUBLIC_CLARITY_ID }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (us-central1 Always Free Tier)
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$AR_REPO/$SERVICE_NAME:$GITHUB_SHA"
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE" \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --cpu=1 \
            --memory=1Gi \
            --min-instances=0 \
            --max-instances=3 \
            --concurrency=80 \
            --timeout=60s \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_APP_URL=https://akilibrain.com"
